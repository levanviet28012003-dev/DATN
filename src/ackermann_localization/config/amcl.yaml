# Định vị AMCL và map_server; thông số giữ từ cấu hình mô phỏng cũ.
amcl:
  ros__parameters:
    # /odom là vị trí thật của Gazebo nên nhiễu chuyển động đặt thấp.
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # Chướng ngại vật thả thêm không có trên bản đồ. Với mô hình likelihood_field thường, AMCL cố khớp
    # chúng với tường và vị trí ước lượng bị kéo lệch (đã đo: 16 cm khi có 4 trụ quanh xe), khiến
    # bộ lập đường tưởng xe đè lên vật cản. Mô hình _prob với beam skip bỏ qua các tia mà phần lớn
    # hạt cho là không khớp bản đồ; khoảng cách khớp tối đa ngắn làm giảm sức kéo của các tia còn lại.
    laser_model_type: likelihood_field_prob
    do_beamskip: true
    beam_skip_distance: 0.3
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    laser_likelihood_max_dist: 0.5
    laser_min_range: 0.15
    laser_max_range: 12.0
    max_beams: 180
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    save_pose_rate: 0.5
    sigma_hit: 0.1
    z_hit: 0.6
    z_rand: 0.4
    z_max: 0.0
    z_short: 0.0
    tf_broadcast: true
    transform_tolerance: 0.5
    # Xe nhỏ và chậm nên cập nhật sau quãng đường ngắn.
    update_min_d: 0.05
    update_min_a: 0.1
    scan_topic: scan
    # Xe được đặt tại gốc bản đồ, hướng +X (xem ackermann_bringup/launch/simulation.launch.py).
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

map_server:
  ros__parameters:
    # yaml_filename do localization.launch.py truyền vào.
    topic_name: map
    frame_id: map
