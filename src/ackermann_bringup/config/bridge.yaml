# Chuyển lệnh vận tốc từ ROS 2 sang Gazebo.
- ros_topic_name: /cmd_vel
  gz_topic_name: /model/ackermann_car/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: ignition.msgs.Twist
  direction: ROS_TO_GZ

# Đưa dữ liệu chuyển động và trạng thái khớp về ROS 2.
- ros_topic_name: /odom
  gz_topic_name: /model/ackermann_car/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS

# Giữ odometry từ bánh xe riêng để so sánh với vị trí thật trong mô phỏng.
- ros_topic_name: /wheel_odom
  gz_topic_name: /model/ackermann_car/wheel_odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /joint_states
  gz_topic_name: /model/ackermann_car/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: ignition.msgs.Model
  direction: GZ_TO_ROS

- ros_topic_name: /tf
  gz_topic_name: /model/ackermann_car/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: ignition.msgs.Pose_V
  direction: GZ_TO_ROS

# Dữ liệu Lidar 2D; chỉ có khi world nạp plugin Sensors.
- ros_topic_name: /scan
  gz_topic_name: /model/ackermann_car/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: ignition.msgs.LaserScan
  direction: GZ_TO_ROS

# GPS mô phỏng, tọa độ WGS84 và độ cao; frame gps_link.
- ros_topic_name: /gps/fix
  gz_topic_name: /model/ackermann_car/gps/fix
  ros_type_name: sensor_msgs/msg/NavSatFix
  gz_type_name: ignition.msgs.NavSat
  direction: GZ_TO_ROS

# Đồng bộ thời gian ROS 2 với thời gian mô phỏng.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS
