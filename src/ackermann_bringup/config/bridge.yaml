# Bridge ROS 2 ↔ Gazebo, dùng cho mọi world (simulation, navigation, outdoor).
# Vị trí thật của Gazebo KHÔNG được dùng làm odometry:
# - /ground_truth/odom chỉ để so sai số, không phát TF; TF odom → base_link do ekf_odom phát,
#   TF map → odom do slam_toolbox phát.
# - Cảm biến thô vào /sim/...; covariance_setter và gps_noise_injector biến chúng thành
#   /wheel_odom, /imu/data, /gps/fix giống dữ liệu xe thật.

- ros_topic_name: /cmd_vel
  gz_topic_name: /model/ackermann_car/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: ignition.msgs.Twist
  direction: ROS_TO_GZ

# Vị trí thật của mô phỏng (frame odom của Gazebo trùng world vì xe xuất phát tại gốc, hướng Đông).
- ros_topic_name: /ground_truth/odom
  gz_topic_name: /model/ackermann_car/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS

# Odometry từ bánh xe của plugin lái, chưa có covariance.
- ros_topic_name: /sim/wheel_odom
  gz_topic_name: /model/ackermann_car/wheel_odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /joint_states
  gz_topic_name: /model/ackermann_car/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: ignition.msgs.Model
  direction: GZ_TO_ROS

- ros_topic_name: /scan
  gz_topic_name: /model/ackermann_car/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: ignition.msgs.LaserScan
  direction: GZ_TO_ROS

# GPS lý tưởng 5 Hz; gps_noise_injector cộng sai số của module GPS rồi phát /gps/fix.
- ros_topic_name: /sim/gps/fix
  gz_topic_name: /model/ackermann_car/gps/fix
  ros_type_name: sensor_msgs/msg/NavSatFix
  gz_type_name: ignition.msgs.NavSat
  direction: GZ_TO_ROS

# IMU có nhiễu nhưng covariance bằng 0; covariance_setter điền covariance.
- ros_topic_name: /sim/imu
  gz_topic_name: /model/ackermann_car/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: ignition.msgs.IMU
  direction: GZ_TO_ROS

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS
