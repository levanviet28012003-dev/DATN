# Bộ điều khiển bám đường Regulated Pure Pursuit, dùng khi controller:=rpp.
# Đi kèm đường Reeds-Shepp (có đoạn lùi): RPP bám được các điểm đổi chiều tiến/lùi, nên xe quay trở
# được ở chỗ hẹp và lùi ra khi vật cản xuất hiện ngay trước mũi.
planner_server:
  ros__parameters:
    GridBased:
      motion_model_for_search: "REEDS_SHEPP"

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.20
      # Khoảng nhìn trước tỉ lệ với tốc độ: 0,36 m khi chạy 0,20 m/s, giảm tới 0,20 m khi xe chậm lại.
      # Thời gian nhìn trước 1,8 s dài hơn hằng số thời gian của khớp lái (khoảng 1 s) để không dao động.
      # Pure Pursuit tới cuối đường theo dây cung nên lệch hướng cỡ (khoảng nhìn trước) / (2 × bán kính cua);
      # vì vậy xe giảm tốc từ 0,5 m trước đích để khoảng nhìn trước ngắn lại và tới đích đúng hướng hơn.
      lookahead_dist: 0.30
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.40
      lookahead_time: 1.8
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.50
      use_collision_detection: true
      # Kiểm tra va chạm theo cung đang chạy trong 0,6 s tới; đặt dài hơn thì xe dừng oan ở khe hẹp.
      max_allowed_time_to_collision_up_to_carrot: 0.8
      # Giảm tốc khi vào cua gắt hơn bán kính này: ở cung 0,6 m xe chạy khoảng 0,13 m/s,
      # vì khớp lái đáp ứng chậm nên chạy nhanh trong cua sẽ trượt ra ngoài.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.08
      use_cost_regulated_linear_velocity_scaling: false
      # Xe Ackermann không xoay tại chỗ được; cho phép lùi theo các đoạn lùi của đường Reeds-Shepp.
      use_rotate_to_heading: false
      allow_reversing: true
      # Chỉ tìm điểm gần xe nhất trong 0,2 m đầu của đường còn lại. Ở chỗ quay trở, các đoạn tiến và lùi
      # nằm sát nhau; với cửa sổ mặc định (1,5 m) RPP nhảy sang đoạn sau, bỏ dở thao tác rồi giật tới lui
      # tại chỗ (đã đo: đổi dấu vận tốc 2 lần mỗi giây, không tiến được).
      max_robot_pose_search_dist: 0.2
      use_interpolation: true
